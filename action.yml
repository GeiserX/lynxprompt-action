name: 'LynxPrompt Action'
description: 'Sync, validate, generate, and diff AI IDE configuration files with LynxPrompt'
author: 'GeiserX'

branding:
  icon: 'layers'
  color: 'purple'

inputs:
  mode:
    description: 'Action mode: sync, validate, generate, or diff'
    required: true
  token:
    description: 'LynxPrompt API token'
    required: true
  api-url:
    description: 'LynxPrompt API URL'
    required: false
    default: 'https://lynxprompt.geiser.cloud'
  files:
    description: 'Glob pattern for config files to process'
    required: false
    default: '**/AGENTS.md,**/CLAUDE.md,**/AIDER.md,**/.github/copilot-instructions.md,**/.windsurfrules,**/.cursor/rules/**/*.mdc'
  visibility:
    description: 'Blueprint visibility when syncing (PRIVATE, TEAM, or PUBLIC). Unset: new blueprints are PRIVATE and existing ones keep the visibility they have.'
    required: false
  team-id:
    description: 'Team that TEAM blueprints are shared with (sync mode). Needed only when you belong to more than one team.'
    required: false
  github-token:
    description: 'GitHub token used to post PR comments (validate and diff modes)'
    required: false
    default: ${{ github.token }}
  platforms:
    description: 'Required platforms for validate mode (comma-separated, e.g. cursor,claude-code,copilot)'
    required: false
  fail-on-drift:
    description: 'Fail the check if drift is detected (diff mode)'
    required: false
    default: 'false'
  commit-changes:
    description: 'Auto-commit generated files (generate mode)'
    required: false
    default: 'false'

outputs:
  synced-count:
    description: 'Number of blueprints synced (sync mode)'
  validation-passed:
    description: 'Whether validation passed (validate mode)'
  generated-count:
    description: 'Number of files generated (generate mode)'
  drift-detected:
    description: 'Whether drift was detected (diff mode)'

runs:
  using: 'node24'
  main: 'dist/index.js'
